<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLT Personal Training Club</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202a;--mute:#6b7785;--line:#e3e7ec;--acc:#1f6feb;--acc-ink:#fff;--grp:#dbe8ff;--grp-b:#7aa7f5;--solo:#d7f3df;--solo-b:#5dbb78;--warn:#b54708;--warn-bg:#fff2e0;--bad:#c0262d;--ok:#12794b;--shadow:0 8px 30px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1318;--card:#171d24;--ink:#e8edf2;--mute:#8a96a3;--line:#27303a;--acc:#4c8dff;--acc-ink:#07101f;--grp:#1d3358;--grp-b:#3e6bb8;--solo:#1b3a28;--solo-b:#3a8a56;--warn:#ffb866;--warn-bg:#3a2a12;--bad:#ff7b81;--ok:#58d39b;--shadow:0 8px 30px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.hide{display:none!important}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.04em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px}
.tab.on{background:var(--acc);color:var(--acc-ink)}
.sp{flex:1}
.wrap{padding:14px max(16px,env(safe-area-inset-left,0px)) 60px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}
h2{margin:0 0 10px;font-size:18px}
h3{margin:16px 0 6px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
/* login */
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .card{display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad);min-height:1.2em}
/* week */
.week{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:auto}
.times{width:46px;flex:none;position:relative;border-right:1px solid var(--line)}
.times div{position:absolute;right:6px;font-size:11px;color:var(--mute);transform:translateY(-7px)}
.day{flex:1;min-width:128px;border-right:1px solid var(--line);position:relative}
.day:last-child{border-right:0}
.dh{position:sticky;left:0;height:34px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-weight:600;font-size:12px;background:var(--card)}
.dh.today{color:var(--acc)}
.body{position:relative}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hl.half{border-top-style:dotted;opacity:.6}
.ev{position:absolute;border-radius:7px;padding:2px 5px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--grp);border:1px solid var(--grp-b);border-left-width:4px}
.ev.solo{background:var(--solo);border-color:var(--solo-b)}
.ev.cx{opacity:.45;text-decoration:line-through}
.ev b{font-weight:700}
.ev .n{color:var(--mute)}
.ev.full .n{color:var(--bad);font-weight:600}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover{background:var(--bg)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.bad{color:var(--bad);border-color:var(--bad)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
.md{background:var(--card);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);padding:18px;position:relative}
.md.wide{width:min(820px,100%)}
.x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:20px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.f input,label.f select{color:var(--ink)}
.bk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bk .nm{flex:1;min-width:140px}
.seg button{border-radius:0;padding:3px 8px;font-size:12px}
.seg button:first-child{border-radius:7px 0 0 7px}
.seg button:last-child{border-radius:0 7px 7px 0}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.res{border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:200px;overflow:auto}
.res div{padding:6px 10px;cursor:pointer}
.res div:hover{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;max-width:90vw}
.pk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.bar2{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:90px;flex:1}
.bar2 i{display:block;height:100%;background:var(--acc)}
.cl-card{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .kl{font-size:12px;color:var(--mute)}.kpi .kv{font-size:24px;font-weight:700}.kpi .ks{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fe{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.fe .ft{color:var(--mute);width:42px;flex:none}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat2 b{display:block;font-size:18px}.stat2 span{font-size:12px;color:var(--mute)}
.wait{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;max-height:130px;overflow:auto}
.wait .wi{padding:3px 9px;border:1px solid var(--line);border-radius:99px;cursor:grab;background:var(--card);font-size:12.5px}
.wait .wi.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.irow{padding:7px 0;border-bottom:1px solid var(--line)}.irow .il{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.ev[draggable=true]{cursor:grab}
svg text{fill:var(--mute);font-size:11px}svg .bar{fill:var(--acc)}svg .gl{stroke:var(--line)}
@media (max-width:640px){.day{min-width:110px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG = window.NLT_CFG || {
  url: 'https://krshyauillsrgoqzyjgc.supabase.co',
  key: 'sb_publishable_RilZiN2LHMDZyc34pl3wwQ_L5SdjaJf'
};
const sb = supabase.createClient(CFG.url, CFG.key);
const VISIT_PRICE = 37;
const LOCS = ['Боян Петров', 'Лерин'];

/* ───────── помощни ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const hm = t => String(t || '').slice(0, 5);
const mins = t => { const [h, m] = hm(t).split(':').map(Number); return h * 60 + m; };
const fromMins = n => `${pad(Math.floor(n / 60))}:${pad(n % 60)}`;
const fmt = s => s ? parse(s).toLocaleDateString('bg-BG', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtLong = s => parse(s).toLocaleDateString('bg-BG', { weekday: 'long', day: 'numeric', month: 'long' });
const money = n => `${Number(n || 0).toFixed(2).replace(/\.00$/, '')} €`;
const today = () => ymd(new Date());
const KIND = { solo: 'Персонален', group: 'Групов' };
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function toast(msg) {
  const t = $('#toast'); t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = '', 3500);
}
function fail(e, what) { console.error(what, e); toast(`${what}: ${e?.message || e}`); }
const modal = {
  show(html, wide) { $('#modal').innerHTML = `<div class="ov" data-act="ov"><div class="md ${wide ? 'wide' : ''}"><button class="x" data-act="close">×</button>${html}</div></div>`; },
  close() { $('#modal').innerHTML = ''; },
  open() { return !!$('#modal .ov'); }
};
const addMonths = (d, n) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
function pkgEnd(start, p) {
  const s = parse(start);
  return ymd(addDays(p.unit === 'weeks' ? addDays(s, 7 * p.duration) : addMonths(s, p.duration), -1));
}

/* ───────── състояние ───────── */
const S = {
  me: null,           // {role:'staff'|'client', row}
  tab: 'week',
  loc: store.get('nlt-loc', LOCS[0]),
  week: monday(new Date()),
  sessions: [], clients: [], packages: [], staff: [], pstat: [],
  q: '', cfilter: 'all'
};
const cname = id => S.clients.find(c => c.id === id)?.name || '—';

/* ───────── вход ───────── */
function loginView(msg, mode) {
  const rec = mode === 'recovery', pw = mode === 'pw', otp = mode === 'otp';
  $('#app').innerHTML = `<div class="login"><div class="card">
    <div class="logo" style="font-size:20px">NLT Personal Training Club</div>
    ${rec ? `<div>Въведи нова парола</div><input id="pw" type="password" placeholder="Нова парола (мин. 8 знака)" autocomplete="new-password">
      <button class="pri" data-act="setpw">Запази паролата</button>` :
    otp ? `<div>Изпратихме имейл до <b>${esc(S.otpEmail || '')}</b>.<br><span class="mute">Въведи кода от имейла или натисни линка в него.</span></div>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Код от имейла" style="letter-spacing:4px;font-size:18px;text-align:center">
      <button class="pri" data-act="verifycode">Вход</button>
      <button class="sm" data-act="sendcode" style="border:0;background:none;color:var(--mute)">Изпрати нов код</button>
      <button class="sm" data-act="othermail" style="border:0;background:none;color:var(--mute)">Друг имейл</button>` :
    pw ? `<input id="em" type="email" placeholder="Имейл" autocomplete="username" value="${esc(S.otpEmail || '')}"><input id="pw" type="password" placeholder="Парола" autocomplete="current-password">
      <button class="pri" data-act="login">Вход</button>
      <button class="sm" data-act="forgot" style="border:0;background:none;color:var(--mute)">Забравена парола</button>
      <button class="sm" data-act="codemode" style="border:0;background:none;color:var(--mute)">Вход с код по имейл</button>` :
    `<div class="mute">Въведи имейла си и ще ти изпратим код за вход. Не е нужна парола.</div>
      <input id="em" type="email" placeholder="Имейл" autocomplete="username" value="${esc(S.otpEmail || '')}">
      <button class="pri" data-act="sendcode">Изпрати код</button>
      <button class="sm" data-act="pwmode" style="border:0;background:none;color:var(--mute)">Вход с парола</button>`}
    <div class="err" id="lerr">${esc(msg || '')}</div></div></div>`;
  $('#pw')?.addEventListener('keydown', e => { if (e.key === 'Enter') $(rec ? '[data-act=setpw]' : '[data-act=login]').click(); });
  $('#em')?.addEventListener('keydown', e => { if (e.key === 'Enter') $(pw ? '[data-act=login]' : '[data-act=sendcode]').click(); });
  $('#code')?.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-act=verifycode]').click(); });
  (otp ? $('#code') : null)?.focus();
}
async function doSendCode() {
  const email = ($('#em')?.value || S.otpEmail || '').trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $('#lerr').textContent = 'Въведи валиден имейл.'; return; }
  $('#lerr').textContent = 'Изпращане…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
  if (error) {
    const m = error.message || '';
    $('#lerr').textContent = /не е регистриран|database error|signups? not allowed|not allowed/i.test(m) ? 'Този имейл не е регистриран в клуба. Свържи се с нас.'
      : /rate|seconds|too many/i.test(m) ? 'Изчакай малко и опитай пак.' : m;
    return;
  }
  S.otpEmail = email; loginView('', 'otp');
}
async function doVerifyCode() {
  const token = ($('#code').value || '').replace(/\s/g, '');
  if (token.length < 6) { $('#lerr').textContent = 'Въведи кода от имейла.'; return; }
  $('#lerr').textContent = '';
  let r = await sb.auth.verifyOtp({ email: S.otpEmail, token, type: 'email' });
  if (r.error) r = await sb.auth.verifyOtp({ email: S.otpEmail, token, type: 'signup' });
  if (r.error) { $('#lerr').textContent = 'Грешен или изтекъл код. Изпрати нов.'; return; }
  boot();
}
async function doLogin() {
  const email = $('#em').value.trim(), password = $('#pw').value;
  $('#lerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) $('#lerr').textContent = /invalid/i.test(error.message) ? 'Грешен имейл или парола.' : error.message;
  else boot();
}
async function doForgot() {
  const email = ($('#em').value || '').trim();
  if (!email) { $('#lerr').textContent = 'Въведи имейла си горе.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $('#lerr').textContent = error ? error.message : 'Изпратихме линк за нова парола на имейла.';
}
async function doSetPw() {
  const password = $('#pw').value;
  if (password.length < 8) { $('#lerr').textContent = 'Паролата трябва да е поне 8 знака.'; return; }
  const { error } = await sb.auth.updateUser({ password });
  if (error) $('#lerr').textContent = error.message; else { history.replaceState(null, '', location.pathname); boot(); }
}

/* ───────── зареждане ───────── */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const uid = session.user.id;
  const { data: st } = await sb.from('staff').select('*').eq('user_id', uid).eq('active', true).maybeSingle();
  if (st) { S.me = { role: 'staff', row: st }; return staffApp(); }
  const { data: cl } = await sb.from('clients').select('*').eq('user_id', uid).maybeSingle();
  if (cl) { S.me = { role: 'client', row: cl }; return clientApp(); }
  $('#app').innerHTML = `<div class="login"><div class="card"><div class="logo">NLT</div><div>Акаунтът ти още не е свързан с клиент или служител. Свържи се с клуба.</div><button data-act="logout">Изход</button></div></div>`;
}
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') loginView('', 'recovery'); });

/* ═════════════════ ПЕРСОНАЛ ═════════════════ */
async function staffApp() {
  const [c, p, s, q] = await Promise.all([
    sb.from('clients').select('id,name,phone,email,status,location,notes').order('name').range(0, 4999),
    sb.from('packages').select('*').order('sort_order'),
    sb.from('staff').select('*').order('name'),
    sb.from('settings').select('*')
  ]);
  if (c.error || p.error || s.error) return fail(c.error || p.error || s.error, 'Грешка при зареждане');
  S.clients = c.data; S.packages = p.data; S.staff = s.data;
  S.policy = { ...POL_DEF, ...((q.data || []).find(x => x.key === 'policy')?.value || {}) };
  S.cv = { ...CV_DEF, ...((q.data || []).find(x => x.key === 'client')?.value || {}) };
  renderStaff();
}
function renderStaff() {
  const admin = S.me.row.role === 'admin';
  $('#app').innerHTML = `
  <div class="bar"><span class="logo">NLT</span>
    <div class="tabs">
      ${[['dash', 'Обобщение'], ['week', 'График'], ['clients', 'Клиенти'], ['packages', 'Пакети'], ['team', 'Служители']].concat(admin ? [['settings', 'Настройки']] : []).map(([t, l]) => `<button class="tab ${S.tab === t ? 'on' : ''}" data-act="tab" data-t="${t}">${l}</button>`).join('')}
    </div><span class="sp"></span>
    <select id="loc">${LOCS.map(l => `<option ${l === S.loc ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <span class="mute">${esc(S.me.row.name)}</span><button class="sm" data-act="logout">Изход</button></div>
  <div class="wrap" id="main"></div>`;
  $('#loc').onchange = e => { S.loc = e.target.value; store.set('nlt-loc', S.loc); renderTab(); };
  renderTab();
}
function renderTab() {
  ({ dash: dashView, week: weekView, clients: clientsView, packages: packagesView, team: teamView, settings: settingsView })[S.tab]();
}

/* ── седмичен график ── */
const H0 = 6, H1 = 21, HH = 48;
async function weekView() {
  const a = ymd(S.week), b = ymd(addDays(S.week, 6));
  const main = $('#main');
  main.innerHTML = `<div class="row" style="margin-bottom:10px">
    <button data-act="wk" data-d="-7">←</button><button data-act="wk" data-d="0">Днес</button><button data-act="wk" data-d="7">→</button>
    <b id="wlabel">${fmt(a)} – ${fmt(b)}</b><span class="sp"></span>
    <span id="wbtn">${waitHtml()}</span><button class="pri" data-act="newsess">+ Нов час</button></div><div id="grid" class="mute">Зареждане…</div>`;
  const { data, error } = await sb.from('sessions')
    .select('*,bookings(id,status,client_id,use_plan)').eq('location', S.loc).gte('date', a).lte('date', b).order('start_time');
  if (error) return fail(error, 'Графикът не се зареди');
  if (ymd(S.week) !== a) return;
  S.sessions = data;
  drawGrid();
}
function layoutDay(evs) {
  const items = evs.map(e => ({ e, s: mins(e.start_time), f: mins(e.start_time) + (e.duration_min || 60) })).sort((x, y) => x.s - y.s || x.f - y.f);
  const out = []; let cluster = [], end = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => { let c = cols.findIndex(x => x <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.f; it.col = c; });
    cluster.forEach(it => it.n = cols.length); out.push(...cluster); cluster = [];
  };
  items.forEach(it => { if (cluster.length && it.s >= end) { flush(); end = -1; } cluster.push(it); end = Math.max(end, it.f); });
  flush(); return out;
}
function drawGrid() {
  const grid = $('#grid'); if (!grid) return;
  const evs = S.sessions;
  let h0 = H0, h1 = H1;
  evs.forEach(e => { h0 = Math.min(h0, Math.floor(mins(e.start_time) / 60)); h1 = Math.max(h1, Math.ceil((mins(e.start_time) + (e.duration_min || 60)) / 60)); });
  const total = (h1 - h0) * HH;
  const days = [...Array(7)].map((_, i) => addDays(S.week, i));
  const showWE = evs.some(e => { const w = (parse(e.date).getDay() + 6) % 7; return w >= 5; });
  const shown = days.filter((_, i) => i < 5 || showWE);
  let lines = '', labels = '';
  for (let h = h0; h <= h1; h++) {
    lines += `<div class="hl" style="top:${(h - h0) * HH}px"></div>`;
    if (h < h1) lines += `<div class="hl half" style="top:${(h - h0) * HH + HH / 2}px"></div>`;
    labels += `<div style="top:${34 + (h - h0) * HH}px">${pad(h)}:00</div>`;
  }
  grid.className = 'week';
  grid.innerHTML = `<div class="times" style="height:${total + 34}px">${labels}</div>` + shown.map(d => {
    const ds = ymd(d);
    const items = layoutDay(evs.filter(e => e.date === ds));
    const html = items.map(({ e, s, col, n }) => {
      const act = e.bookings.filter(b => b.status !== 'cancelled');
      const names = act.map(b => cname(b.client_id).split(' ')[0] + ' ' + (cname(b.client_id).split(' ')[1] || '')[0] + '.').join(', ');
      const full = e.kind === 'group' && e.capacity && act.length >= e.capacity;
      const top = (s - h0 * 60) / 60 * HH, hgt = Math.max(((e.duration_min || 60) / 60) * HH - 2, 18);
      const label = e.kind === 'solo' ? (act.length ? esc(act.map(b => cname(b.client_id)).join(', ')) : '<span class="n">свободен</span>') : `${esc(e.title || 'Групов час')}`;
      return `<div class="ev ${e.kind === 'solo' ? 'solo' : ''} ${e.cancelled ? 'cx' : ''} ${full ? 'full' : ''}" draggable="true" data-act="sess" data-id="${e.id}"
        style="top:${top}px;height:${hgt}px;left:calc(${col / n * 100}% + 1px);width:calc(${100 / n}% - 3px)" title="${esc(names)}">
        <b>${hm(e.start_time)}</b> ${label}${e.kind === 'group' ? ` <span class="n">${act.length}${e.capacity ? '/' + e.capacity : ''}</span>` : ''}</div>`;
    }).join('');
    return `<div class="day"><div class="dh ${ds === today() ? 'today' : ''}">${d.toLocaleDateString('bg-BG', { weekday: 'short', day: 'numeric', month: 'numeric' })}</div>
      <div class="body" data-act="slot" data-date="${ds}" data-h0="${h0}" style="height:${total}px">${lines}${html}</div></div>`;
  }).join('');
}

async function dropOnGrid(e) {
  const body = e.target.closest('.body'); if (!body) return;
  e.preventDefault();
  const data = e.dataTransfer.getData('text/plain') || '', r = body.getBoundingClientRect(), h0 = +body.dataset.h0;
  if (data.startsWith('wait:')) { const m = Math.floor((e.clientY - r.top) / (HH / 2)) * 30 + h0 * 60; return quickBook(data.slice(5), body.dataset.date, fromMins(m)); }
  if (data.startsWith('ev:')) {
    const off = S.dragOff || 0, m = Math.round((e.clientY - r.top - off) / (HH / 2)) * 30 + h0 * 60;
    const ev = S.sessions.find(x => x.id === data.slice(3)); if (!ev) return;
    const nt = fromMins(Math.max(0, Math.min(m, 23 * 60 + 30)));
    if (ev.date === body.dataset.date && hm(ev.start_time) === nt) return;
    const { error } = await sb.from('sessions').update({ date: body.dataset.date, start_time: nt }).eq('id', ev.id);
    if (error) return fail(error, 'Не се премести');
    logEvent('change', `Преместен час: ${dmm(ev.date)} ${hm(ev.start_time)} → ${dmm(body.dataset.date)} ${nt}${ev.title ? ' · ' + ev.title : ''}`);
    weekView();
  }
}

async function bookClient(sid, cid2, auto) {
  const { data: s } = await sb.from('sessions').select('*,bookings(id,status,client_id)').eq('id', sid).single();
  const ex = s.bookings.find(b => b.client_id === cid2);
  const taken = s.bookings.filter(b => b.status !== 'cancelled').length;
  if (ex && ex.status !== 'cancelled') { toast(`${cname(cid2)} вече е записан.`); return false; }
  if (s.capacity && taken >= s.capacity) { if (auto) { toast('Часът е пълен.'); return false; } if (!confirm(`Часът е пълен (${taken}/${s.capacity}). Да се добави ли все пак?`)) return false; }
  const { data: ps } = await sb.from('package_status').select('*').eq('client_id', cid2).eq('kind', s.kind).lte('start_date', s.date).gte('end_date', s.date);
  const valid = (ps || []).find(p => p.used < p.total);
  let use_plan = true, price = null;
  if (!valid) {
    if (!auto) {
      const why = (ps || []).length ? 'пакетът му е изчерпан' : 'няма ' + (s.kind === 'solo' ? 'пакет с персонални тренировки' : 'пакет с групови класове') + ' за тази дата';
      if (!confirm(`${cname(cid2)}: ${why}.\n\nOK = добави като еднократно посещение (${money(VISIT_PRICE)}).\nОтказ = не добавяй.`)) return false;
    }
    use_plan = false; price = VISIT_PRICE;
  }
  let bid;
  if (ex) { const r = await sb.from('bookings').update({ status: 'booked', late: false, use_plan, price }).eq('id', ex.id).select('id').single(); if (r.error) { fail(r.error, 'Не се добави'); return false; } bid = r.data.id; }
  else { const r = await sb.from('bookings').insert({ session_id: sid, client_id: cid2, use_plan, price }).select('id').single(); if (r.error) { fail(r.error, 'Не се добави'); return false; } bid = r.data.id; }
  if (!use_plan) await sb.from('charges').insert({ client_id: cid2, amount: price, date: s.date, booking_id: bid, note: `Еднократно посещение ${fmt(s.date)} ${hm(s.start_time)}` });
  logEvent('new', `Записан: ${bkLabel(cid2, s.date, s.start_time)}${s.title ? ' · ' + s.title : ''}${use_plan ? ' (абонамент)' : ' (еднократно)'}`);
  return true;
}

/* ═════════════════ КЛИЕНТ ═════════════════ */
const calStamp = (date, time, addMin = 0) => { const [y, m, d] = date.split('-').map(Number), t = mins(time) + addMin; const x = new Date(y, m - 1, d + Math.floor(t / 1440)); return `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(Math.floor((t % 1440) / 60))}${pad(t % 60)}00`; };
function gcalUrl(se) {
  const q = new URLSearchParams({ action: 'TEMPLATE', text: `${se.title || KIND[se.kind] + ' час'} · NLT Personal Training Club`, dates: `${calStamp(se.date, se.start_time)}/${calStamp(se.date, se.start_time, se.duration_min || 60)}`, ctz: 'Europe/Sofia', location: `NLT Personal Training Club, ${se.location}`, details: 'Записан час в NLT Personal Training Club.' });
  return 'https://calendar.google.com/calendar/render?' + q;
}
function icsFor(list) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ev = list.map(b => `BEGIN:VEVENT\r\nUID:${b.id}@nlt-gym\r\nDTSTAMP:${stamp}\r\nDTSTART;TZID=Europe/Sofia:${calStamp(b.sessions.date, b.sessions.start_time)}\r\nDTEND;TZID=Europe/Sofia:${calStamp(b.sessions.date, b.sessions.start_time, b.sessions.duration_min || 60)}\r\nSUMMARY:${(b.sessions.title || KIND[b.sessions.kind] + ' час').replace(/[,;]/g, ' ')} · NLT\r\nLOCATION:NLT Personal Training Club ${b.sessions.location}\r\nEND:VEVENT`).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//NLT//BG\r\nCALSCALE:GREGORIAN\r\n${ev}\r\nEND:VCALENDAR\r\n`;
}
function downloadIcs(bid) {
  const list = bid ? C.bookings.filter(b => b.id === bid) : C.bookings; if (!list.length) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([icsFor(list)], { type: 'text/calendar' })); a.download = bid ? 'nlt-chas.ics' : 'nlt-chasove.ics'; document.body.appendChild(a); a.click(); a.remove();
}

}
function clientCancelDialog(bid, sid) {
  const b = C.bookings.find(x => x.id === bid); if (!b) return;
  const must = C.policy.mustResched !== false;
  const pk = C.pkgs.find(p => p.kind === 'group' && p.start_date <= b.sessions.date && p.end_date >= b.sessions.date);
  const opts = C.classes.filter(s => !s.mine && s.free !== 0 && s.date !== b.sessions.date && pk && s.date >= pk.start_date && s.date <= pk.end_date);
  const hrs = C.cv.cancelMinHours ?? 12;
  modal.show(`<h2>Отказ от час</h2><div class="mute">${fmtLong(b.sessions.date)} · ${hm(b.sessions.start_time)}</div>
    <p>${must ? `Часът трябва да се презапише за друг ден в рамките на абонамента. Отказ по-късно от ${hrs} ч. преди началото се брои като проведен.` : 'Можеш да се откажеш или да преместиш часа.'}</p>
    <label class="f">Нов час<select id="re-sel">${must ? '' : '<option value="">— само отказ —</option>'}${opts.map(s => `<option value="${s.id}">${fmtLong(s.date)} · ${hm(s.start_time)} (${s.free ?? '?'} места)</option>`).join('')}</select></label>
    ${must && !opts.length ? '<div class="err">Няма свободни часове за друг ден в рамките на абонамента ти.</div>' : ''}
    <div class="row" style="margin-top:12px"><button class="pri" data-act="cdo" data-bid="${bid}" ${must && !opts.length ? 'disabled' : ''}>Потвърди</button></div>`);
}
async function clientCancel(bid) {
  const ns = $('#re-sel').value || null;
  const { error } = await sb.rpc('cancel_booking', { p_booking: bid, p_new_session: ns });
  if (error) return fail(error, 'Отказът не успя'); modal.close(); toast('Готово'); clientApp();
}

/* ═════════════════ събития ═════════════════ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'ov') { if (e.target === el) modal.close(); return; }
  if (act === 'slot') {
    if (e.target.closest('.ev')) return;
    const r = el.getBoundingClientRect(); const y = e.clientY - r.top;
    const tt = fromMins(Math.floor((y / HH * 60) / 30) * 30 + (+el.dataset.h0) * 60);
    if (S.waitPick) return quickBook(S.waitPick, el.dataset.date, tt);
    return newSessionDialog(el.dataset.date, tt);
  }
  e.preventDefault();
  try {
    switch (act) {
      case 'close': modal.close(); break;
      case 'login': await doLogin(); break;
      case 'sendcode': await doSendCode(); break;
      case 'verifycode': await doVerifyCode(); break;
      case 'pwmode': S.otpEmail = ($('#em')?.value || '').trim(); loginView('', 'pw'); break;
      case 'codemode': loginView(); break;
      case 'othermail': S.otpEmail = ''; loginView(); break;
      case 'cscroll': document.getElementById('c-book')?.scrollIntoView({ behavior: 'smooth' }); break;
      case 'forgot': await doForgot(); break;
      case 'setpw': await doSetPw(); break;
      case 'logout': await sb.auth.signOut(); S.me = null; loginView(); break;
      case 'tab': S.tab = el.dataset.t; renderStaff(); break;
      case 'wk': S.week = el.dataset.d === '0' ? monday(new Date()) : addDays(S.week, +el.dataset.d); weekView(); break;
      case 'sess': if (S.waitPick) { const cid3 = S.waitPick; S.waitPick = null; if (await bookClient(el.dataset.id, cid3, true)) toast('Записан'); weekView(); } else openSession(el.dataset.id); break;
      case 'newsess': newSessionDialog(); break;
      case 'nsave': await createSession({ kind: $('#n-kind').value, date: $('#n-date').value, time: $('#n-time').value, dur: +$('#n-dur').value || 60, trainer: $('#n-tr').value, title: $('#n-title').value.trim(), cap: +$('#n-cap').value || null, repeat: $('#n-rep').checked }); break;
      case 'ssave': await saveSession(); break;
      case 'mv': await moveSession(+el.dataset.dm); break;
      case 'scancel': { const { data: s } = await sb.from('sessions').select('cancelled').eq('id', sessId()).single(); await sb.from('sessions').update({ cancelled: !s.cancelled }).eq('id', sessId()); await refreshAfter(sessId()); break; }
      case 'sdel': if (confirm('Да се изтрие ли часът заедно със записванията?')) { const id = sessId(); const { error } = await sb.from('sessions').delete().eq('id', id); if (error) return fail(error, 'Не се изтри'); modal.close(); weekView(); } break;
      case 'bst': await setBookingStatus(el.closest('.bk').dataset.bid, el.dataset.st); break;
      case 'brm': { const bid = el.closest('.bk').dataset.bid; if (!confirm('Да се премахне ли записването?')) break; const bb = (await sb.from('bookings').select('client_id,sessions(date,start_time)').eq('id', bid).single()).data; await removeCharge(bid); await sb.from('bookings').delete().eq('id', bid); if (bb) logEvent('removed', `Премахнат: ${bkLabel(bb.client_id, bb.sessions.date, bb.sessions.start_time)}`); await refreshAfter(sessId()); break; }
      case 'client': modal.show('<div class="mute">Зареждане…</div>', true); await openClient(el.dataset.id); break;
      case 'csave': await saveClient(); break;
      case 'cpadd': await addPackage(); break;
      case 'cpdel': if (confirm('Да се изтрие ли пакетът?')) { await sb.from('client_packages').delete().eq('id', el.dataset.id); await afterClient(); } break;
      case 'payadd': { const a = +$('#pay-amt').value; if (!a) return toast('Въведи сума.'); await sb.from('payments').insert({ client_id: cid(), amount: a, method: $('#pay-m').value, note: $('#pay-note').value.trim() || null }); logEvent('paid', `Плащане ${money(a)}: ${cname(cid())}`); await afterClient(); break; }
      case 'paydel': await sb.from('payments').delete().eq('id', el.dataset.id); await afterClient(); break;
      case 'chgadd': { const a = +$('#chg-amt').value; if (!a) return toast('Въведи сума.'); await sb.from('charges').insert({ client_id: cid(), amount: a, note: $('#chg-note').value.trim() || null }); await afterClient(); break; }
      case 'chdel': await sb.from('charges').delete().eq('id', el.dataset.id); await afterClient(); break;
      case 'newclient': newClientDialog(); break;
      case 'ncsave': { const name = $('#nc-name').value.trim(); if (!name) return toast('Въведи име.');
        const { data, error } = await sb.from('clients').insert({ name, phone: $('#nc-phone').value.trim() || null, email: $('#nc-email').value.trim() || null, location: $('#nc-loc').value }).select().single();
        if (error) return fail(error, 'Не се създаде'); S.clients.push(data); S.clients.sort((a, b) => a.name.localeCompare(b.name, 'bg')); modal.close(); drawClients(); await openClient(data.id); break; }
      case 'dmonth': D.month = shiftM(D.month, +el.dataset.d); dashView(); break;
      case 'aday': D.day = el.dataset.d === '0' ? today() : ymd(addDays(parse(D.day), +el.dataset.d)); dashView(); break;
      case 'afilter': D.filter = el.dataset.v; dashView(); break;
      case 'ptab': D.tab = el.dataset.v; dashView(); break;
      case 'ctab': D.chart = el.dataset.v; dashView(); break;
      case 'quickpay': { const a = Math.round(+el.dataset.amt * 100) / 100; await sb.from('payments').insert({ client_id: el.dataset.id, amount: a, method: 'В брой', note: 'Плащане на дължимо' }); logEvent('paid', `Плащане ${money(a)}: ${cname(el.dataset.id)}`); dashView(); break; }
      case 'pkgnew': pkgDialog('new'); break;
      case 'pkgedit': pkgDialog(el.dataset.id); break;
      case 'pkgtoggle': S.openPkg = S.openPkg === el.dataset.id ? null : el.dataset.id; drawPackages(); break;
      case 'pkgsave': await savePkg(); break;
      case 'pkgdel': if (confirm('Да се изтрие ли пакетът? Вече зададените на клиенти пакети остават.')) { const { error } = await sb.from('packages').delete().eq('id', $('#pkd').dataset.id); if (error) return fail(error, 'Не се изтри'); S.packages = (await sb.from('packages').select('*').order('sort_order')).data; modal.close(); drawPackages(); } break;
      case 'trnew': trainerDialog('new'); break;
      case 'tredit': trainerDialog(el.dataset.id); break;
      case 'trsave': await saveTrainer(); break;
      case 'trdel': if (confirm('Да се изтрие ли служителят? Ако има часове, по-добре го направи неактивен.')) { const { error } = await sb.from('staff').delete().eq('id', $('#trd').dataset.id); if (error) return fail(error, 'Не се изтри (има свързани часове — направи го неактивен)'); S.staff = (await sb.from('staff').select('*').order('name')).data; modal.close(); teamView(); } break;
      case 'sub': S.sub = el.dataset.v; settingsView(); break;
      case 'policysave': await savePolicy(); break;
      case 'cvsave': await saveCv(); break;
      case 'wtoggle': S.waitOpen = !S.waitOpen; $('#wbtn').innerHTML = waitHtml(); break;
      case 'wpick': S.waitPick = S.waitPick === el.dataset.id ? null : el.dataset.id; $('#wbtn').innerHTML = waitHtml(); break;
      case 'wclear': S.waitPick = null; $('#wbtn').innerHTML = waitHtml(); break;
      case 'ics': downloadIcs(el.dataset.id); break;
      case 'cbook': await clientBook(el.dataset.id); break;
      case 'ccancel': clientCancelDialog(el.closest('.bk').dataset.bid, el.closest('.bk').dataset.sid); break;
      case 'cdo': await clientCancel(el.dataset.bid); break;
      case 'blate': break;
    }
  } catch (err) { fail(err, 'Грешка'); }
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act=blate]');
  if (el) { const bid = el.closest('.bk').dataset.bid; await sb.from('bookings').update({ late: el.checked }).eq('id', bid); await refreshAfter(sessId()); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'add-q') return;
  const q = e.target.value.trim().toLowerCase(), box = $('#add-res');
  if (q.length < 2) { box.classList.add('hide'); return; }
  const m = S.clients.filter(c => c.name.toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = m.map(c => `<div data-pick="${c.id}">${esc(c.name)} <span class="mute">${esc(c.phone || '')}</span></div>`).join('') || '<div class="mute">Няма резултат</div>';
  box.classList.remove('hide');
});
document.addEventListener('click', async e => {
  const p = e.target.closest('[data-pick]'); if (!p) return;
  $('#add-res').classList.add('hide'); $('#add-q').value = '';
  await addClientToSession(p.dataset.pick);
});
document.addEventListener('dragstart', e => {
  const ev = e.target.closest?.('.ev'), w = e.target.closest?.('.wi');
  if (ev) { S.dragOff = e.clientY - ev.getBoundingClientRect().top; e.dataTransfer.setData('text/plain', 'ev:' + ev.dataset.id); e.dataTransfer.effectAllowed = 'move'; }
  else if (w) e.dataTransfer.setData('text/plain', 'wait:' + w.dataset.id);
});
document.addEventListener('dragover', e => { if (e.target.closest?.('.body')) e.preventDefault(); });
document.addEventListener('drop', e => { dropOnGrid(e); });
document.addEventListener('input', e => { if (e.target.id === 'wq') { S.wq = e.target.value; const pos = e.target.selectionStart; $('#wbtn').innerHTML = waitHtml(); const n = $('#wq'); n.focus(); n.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.open()) modal.close(); });

if (location.hash.includes('type=recovery')) loginView('', 'recovery'); else boot();
</script>
