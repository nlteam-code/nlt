<html lang="bg">
<head>
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#11151b">
<meta charset="utf-8">

<title>NLT Personal Training Club</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%2311151b%22/%3E%3Ctext%20x%3D%2229%22%20y%3D%2242%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%20Black%2CArial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22900%22%20font-style%3D%22italic%22%20font-size%3D%2225%22%20fill%3D%22%23fff%22%20letter-spacing%3D%22-1%22%3ENLT%3C/text%3E%3Cpath%20d%3D%22M50%2016l8%2010H42z%22%20fill%3D%22%23e2263a%22/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}
:root{--bg:#f2f3f7;--card:#fff;--ink:#1d2430;--mute:#6a7482;--line:#e8ebf0;--acc:#eb4c51;--acc-ink:#fff;--navy:#262d38;--org:#f48460;--grp:rgba(38,45,56,.07);--grp-b:#262d38;--solo:rgba(235,76,81,.11);--solo-b:#eb4c51;--warn:#b4531d;--warn-bg:#fff0e6;--bad:#d1363c;--ok:#0f8a5f;--shadow:0 1px 2px rgba(20,28,40,.05),0 12px 32px rgba(20,28,40,.10);--sh:0 1px 2px rgba(20,28,40,.04),0 8px 24px rgba(20,28,40,.06)}
@media all{:root:not([data-theme=light]){--bg:#11151b;--card:#1a1f27;--ink:#f3f5f8;--mute:#97a1af;--line:rgba(255,255,255,.09);--acc:#f0575c;--acc-ink:#fff;--grp:rgba(255,255,255,.08);--grp-b:#9aa6b8;--solo:rgba(240,87,92,.18);--solo-b:#f0575c;--warn:#ffb27d;--warn-bg:#3a2417;--bad:#ff7b81;--ok:#58d39b;--shadow:0 12px 36px rgba(0,0,0,.5);--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.hide{display:none!important}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.04em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px}
.tab.on{background:var(--acc);color:var(--acc-ink)}
.sp{flex:1}
.wrap{padding:14px max(16px,env(safe-area-inset-left,0px)) 60px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}
h2{margin:0 0 10px;font-size:18px}
h3{margin:16px 0 6px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
/* login */
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .card{display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad);min-height:1.2em}
/* week */
.week{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:auto}
.times{width:46px;flex:none;position:relative;border-right:1px solid var(--line)}
.times div{position:absolute;right:6px;font-size:11px;color:var(--mute);transform:translateY(-7px)}
.day{flex:1;min-width:128px;border-right:1px solid var(--line);position:relative}
.day:last-child{border-right:0}
.dh{position:sticky;left:0;height:34px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-weight:600;font-size:12px;background:var(--card)}
.dh.today{color:var(--acc)}
.body{position:relative}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hl.half{border-top-style:dotted;opacity:.6}
.ev{position:absolute;border-radius:7px;padding:2px 5px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--grp);border:1px solid var(--grp-b);border-left-width:4px}
.ev.solo{background:var(--solo);border-color:var(--solo-b)}
.ev .cx{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--bad);text-transform:uppercase}
.ev b{font-weight:700}
.ev .n{color:var(--mute)}
.ev.full .n{color:var(--bad);font-weight:600}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover{background:var(--bg)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.bad{color:var(--bad);border-color:var(--bad)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
.md{background:var(--card);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);padding:18px;position:relative}
.md.wide{width:min(820px,100%)}
.x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:20px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.f input,label.f select{color:var(--ink)}
.vx-ks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vx-k{background:var(--card2,rgba(127,127,127,.08));border-radius:12px;padding:10px 12px}
.vx-k b{display:block;font-size:18px;line-height:1.2}
.vx-k span{font-size:12px;color:var(--mute)}
.vw{margin-bottom:10px}
.vw-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 4px}
.vw-h b{font-size:13px}
.vw-h span{font-size:12px;color:var(--mute)}
.vw-r{display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 10px;border:1px solid var(--line);border-top:0}
.vw-h + .vw-r{border-top:1px solid var(--line);border-radius:10px 10px 0 0}
.vw-r:last-child{border-radius:0 0 10px 10px}
.vw-h + .vw-r:last-child{border-radius:10px}
.vw-r.dim{opacity:.55}
.vw-day{width:44px;flex:none;font-size:12px;font-weight:700;color:var(--mute)}
.vw-day.hot{color:#eb4c51}
.vw-tm{width:42px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.vw-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-n i{font-style:normal;color:var(--mute);font-size:12px;margin-left:8px}
.vw-st{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:rgba(127,127,127,.14)}
.vw-st.ok{background:rgba(59,167,118,.16);color:#2f9a68}
.vw-st.bad{background:rgba(235,76,81,.16);color:#d8434a}
.vw-st.warn{background:rgba(240,160,40,.18);color:#b8770e}
.vw-x{flex:none;display:flex;gap:4px;opacity:.35;transition:opacity .15s}
.vw-r:hover .vw-x{opacity:1}
.vw-x .sm{padding:2px 8px;font-size:12px}
@media(max-width:640px){.vx-ks{grid-template-columns:repeat(2,minmax(0,1fr))}.vw-x{opacity:1}}
.bk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bk .nm{flex:1;min-width:140px}
.seg button{border-radius:0;padding:3px 8px;font-size:12px}
.seg button:first-child{border-radius:7px 0 0 7px}
.seg button:last-child{border-radius:0 7px 7px 0}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.res{border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:200px;overflow:auto}
.res div{padding:6px 10px;cursor:pointer}
.res div:hover{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;max-width:90vw}
.pk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.bar2{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:90px;flex:1}
.bar2 i{display:block;height:100%;background:var(--acc)}
.cl-card{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .kl{font-size:12px;color:var(--mute)}.kpi .kv{font-size:24px;font-weight:700}.kpi .ks{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fe{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.fe .ft{color:var(--mute);width:42px;flex:none}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat2 b{display:block;font-size:18px}.stat2 span{font-size:12px;color:var(--mute)}
.wkl{display:flex;gap:12px;align-items:flex-start}.wkl>#grid{flex:1;min-width:0}#wbtn{flex:0 0 230px;position:sticky;top:8px}#wbtn:empty{display:none}
.wcard{padding:10px}.wait{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 330px);min-height:120px;overflow:auto}
.wait .wi{padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:grab;background:var(--card);font-size:13px;display:flex;flex-direction:column;line-height:1.25}
.wait .wi .wm{font-size:11.5px;color:var(--mute)}.wait .wi.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.wait .wi.on .wm{color:inherit;opacity:.85}
@media (max-width:820px){.wkl{flex-direction:column}#wbtn{flex:none;width:100%;position:static}.wait{max-height:200px}}
.irow{padding:7px 0;border-bottom:1px solid var(--line)}.irow .il{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.ev[draggable=true]{cursor:grab}
svg text{fill:var(--mute);font-size:11px}svg .bar{fill:var(--acc)}svg .gl{stroke:var(--line)}
@media (max-width:640px){.day{min-width:110px}}


/* ───── администраторски екран · NLT бранд, Apple-стил ───── */
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h2,h3,.kpi .kv,.tab,.logo{font-family:Montserrat,Roboto,sans-serif}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.card,.kpi,.tw,.week{border:0;border-radius:22px;box-shadow:var(--sh)}
.card{padding:20px}
.tw{border-radius:16px;box-shadow:none;border:1px solid var(--line)}
.bar{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);padding-top:10px;padding-bottom:10px}
.bar .logo{font-weight:900;font-style:italic;font-size:20px;letter-spacing:.03em;color:var(--ink);padding-right:6px}
.tabs{background:var(--bg);padding:4px;border-radius:14px;gap:2px;flex-wrap:nowrap}
.tab{border-radius:11px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--mute);transition:.18s}
.tab:hover{border:0;color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,28,40,.12)}
.bar select{border-radius:12px;border:0;background:var(--bg);padding:8px 12px;font-weight:500}
button,input,select,textarea{border-radius:12px}
input,select,textarea{border:1px solid var(--line);padding:9px 12px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px;border-color:var(--acc)}
button{border:1px solid var(--line);transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--org));border:0;color:#fff;font-weight:700;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
button.pri:hover{color:#fff;filter:brightness(1.06)}
button.sm{border-radius:99px;padding:4px 11px;font-weight:500}
.chips button.on,.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media all{:root:not([data-theme=light]) .chips button.on,:root:not([data-theme=light]) .seg button.on{background:#fff;color:#11151b;border-color:#fff}}
.chip{border:0;background:var(--bg);color:var(--mute);font-weight:500;padding:2px 10px}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
th{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700;color:var(--mute);background:transparent;padding:10px 12px}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.click:hover,tbody tr:hover{background:color-mix(in srgb,var(--bg) 70%,transparent)}
td b{font-weight:600}
.kpis{gap:14px;margin-bottom:16px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .kl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kpi .kv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpis>.kpi:first-child .kv{background:linear-gradient(135deg,var(--acc),var(--org));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .spark{position:absolute;right:12px;bottom:12px;width:96px;height:34px;opacity:.9}
.cols{gap:16px;margin-bottom:16px}
.stat2{gap:16px}.stat2 b{font-family:Montserrat,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em}
.fe{border-bottom:1px solid var(--line);padding:8px 0}
.wrap{padding-top:20px}
.md{border-radius:26px;padding:24px}
.ov{background:rgba(14,18,26,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bk,.pk{border-bottom:1px solid var(--line)}
.bar2{height:8px;border-radius:99px}.bar2 i{background:linear-gradient(90deg,var(--acc),var(--org));border-radius:99px}
.toast{border-radius:99px;padding:11px 20px;box-shadow:var(--shadow)}
/* график */
.dh{font-family:Montserrat,sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);height:38px}
.dh.today{color:var(--acc)}
.hl{border-top-color:var(--line)}
.ev{border:0;border-left:4px solid var(--grp-b);border-radius:10px;padding:4px 7px;box-shadow:0 1px 2px rgba(20,28,40,.06);transition:transform .12s,box-shadow .12s}
.ev:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,28,40,.14);z-index:3}
.ev.solo{border-left-color:var(--solo-b)}
/* цвят по треньор: Петя — червен, Аксел — лилав (групови и персонални) */
.ev.tr-red{background:rgba(235,76,81,.16);border-left-color:#eb4c51}
.ev.tr-violet{background:rgba(139,92,246,.16);border-left-color:#8b5cf6}
:root:not([data-theme=light]) .ev.tr-red{background:rgba(240,87,92,.24)}
:root:not([data-theme=light]) .ev.tr-violet{background:rgba(167,139,250,.24);border-left-color:#a78bfa}
.ev b{font-weight:700}
.times div{font-variant-numeric:tabular-nums}
/* диаграми */
svg .bar{fill:url(#gbar)}
svg .gl{stroke:var(--line);stroke-dasharray:2 4}
svg text{font-family:Roboto,sans-serif;font-size:11px}
svg .bcol{transition:opacity .15s}
.chartw:hover .bcol{opacity:.45}.chartw .bcol:hover{opacity:1}
/* ───── клиентски екран · NLT бранд ───── */
:root{--c-bg:#f2f3f7;--c-card:#fff;--c-ink:#1d2430;--c-mute:#6a7482;--c-line:#e4e7ed;--c-navy:#262d38;--c-coral:#eb4c51;--c-orange:#f48460;--c-ringbg:rgba(38,45,56,.09);--c-nav:rgba(255,255,255,.82);--c-shadow:0 1px 2px rgba(20,28,40,.05),0 8px 24px rgba(20,28,40,.06)}
@media all{:root:not([data-theme=light]){--c-bg:#11151b;--c-card:#1a1f27;--c-ink:#f3f5f8;--c-mute:#97a1af;--c-line:rgba(255,255,255,.09);--c-ringbg:rgba(255,255,255,.1);--c-nav:rgba(26,31,39,.78);--c-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--c-bg:#11151b;--c-card:#1a1f27;--c-ink:#f3f5f8;--c-mute:#97a1af;--c-line:rgba(255,255,255,.09);--c-ringbg:rgba(255,255,255,.1);--c-nav:rgba(26,31,39,.78);--c-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35)}
body.cm{background:var(--c-bg);--bg:var(--c-bg);--card:var(--c-card);--ink:var(--c-ink);--mute:var(--c-mute);--line:var(--c-line);--acc:var(--c-coral);--acc-ink:#fff;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.cm .md{border-radius:26px}
body.cm button.pri{border-radius:14px;min-height:44px;font-weight:700}
body.cm input,body.cm select{border-radius:14px;padding:12px 14px;font-size:16px}
body.cm .login .card{background:transparent;border:0;box-shadow:none;align-items:stretch;gap:12px;text-align:center}
body.cm .login{margin-top:9vh}
body.cm .login .card .logo{display:none}
body.cm .login button.pri{min-height:50px;font-size:16px;border-radius:16px}
.c-logoimg{display:block;width:auto;max-width:60vw;object-fit:contain}
.c-logo{font-family:Montserrat,sans-serif;font-weight:900;font-style:italic;letter-spacing:.04em;font-size:22px}
.login .c-logoimg{margin:0 auto 6px;max-width:220px}
body.cm:not(.x) .c-logoimg{filter:none}
@media not all{:root:not([data-theme=dark]) .c-top .c-logoimg,:root:not([data-theme=dark]) .login .c-logoimg{background:var(--c-navy);padding:6px 12px;border-radius:12px}}
:root[data-theme=light] .c-top .c-logoimg,:root[data-theme=light] .login .c-logoimg{background:var(--c-navy);padding:6px 12px;border-radius:12px}
.cx{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}

const FIN = { sheet: 'Общо', y: new Date().getFullYear(), lines: [], vals: {}, act: null, edit: null };
const FIN_SHEETS = ['Общо', 'Боян Петров', 'Лерин', 'Масажно', 'Общи'];

const FIN_MAS_SHARE = 0.4; // заплата масажист: 40% от остатъка
const fnum = v => v == null || v === '' || isNaN(v) ? '' : String(Math.round(v) || 0).replace('-', '−').replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');

function finRow(id) { const o = FIN.vals[id] || {}; return Array.from({ length: 12 }, (_, i) => o[i + 1] ?? null); }
function finActual(kind, loc) {
  const a = Array(12).fill(null), src = kind === 'pay' ? FIN.act.pay : kind === 'vis' ? FIN.act.vis : FIN.act.mas;

/* Изчислява всичко за един лист: приход, разходи по категории, печалба */
function finCalc(sheet) {

  const byKind = k => L.find(l => l.kind === k);
  const cats = FIN_CATS.map(c => { const ls = L.filter(l => l.kind === 'exp' && l.cat === c); const rows = ls.map(l => ({ l, v: finRow(l.id) })); return { c, rows, tot: Array.from({ length: 12 }, (_, i) => rows.some(r => r.v[i] != null) ? fsum(rows.map(r => r.v[i])) : null) }; });

    const vs = vl ? finRow(vl.id) : Array(12).fill(null), pr = pl ? finRow(pl.id) : Array(12).fill(null);

    out.visits = vs.map((v, i) => (FIN.y * 12 + i >= 2026 * 12 + 10 && va[i] != null) ? va[i] : (v != null ? v : va[i]));
    out.est = out.visits.map((v, i) => v != null && pr[i] != null ? v * pr[i] : null);
    out.rev = pay.map((p, i) => p != null && p !== 0 ? p : out.est[i]);

/* Авто-обновяване на графика: всеки 15 сек. (и при връщане в прозореца) проверява за промени,
   направени от друг служител или от клиент, и прерисува без презареждане на страницата */
const schedSig = L => JSON.stringify((L || []).map(s => [s.id, s.date, s.start_time, s.trainer_id, s.location, s.cancelled, s.duration_min, s.capacity, s.title, s.kind, (s.bookings || []).map(b => b.id + b.status + (b.use_plan ? 1 : 0)).sort()]).sort());
async function schedPoll() {
  if (window.__schedBusy || Date.now() - (window.__schedLast || 0) < 4000) return;
  window.__schedBusy = true; try { await schedPoll0(); } finally { window.__schedBusy = false; window.__schedLast = Date.now(); }
}
async function schedPoll0() {
  if (S.tab !== 'week' || S.massage || document.hidden || !$('#grid') || !S.week) return;
  if (document.querySelector('.modal.on, dialog[open], .ctx')) return;
  const a = ymd(S.week), b = ymd(addDays(S.week, calSpan() - 1)), loc = S.loc;
  const { data, error } = await sb.from('sessions').select('*,bookings(id,status,client_id,use_plan)').eq('location', loc).gte('date', a).lte('date', b).order('start_time');
  if (error || !data || S.tab !== 'week' || ymd(S.week) !== a || S.loc !== loc || calSpan() - 1 !== Math.round((parse(b) - parse(a)) / 864e5)) return;
  if (document.querySelector('.modal.on, dialog[open], .ctx')) return;
  if (schedSig(data) === schedSig(S.sessions)) return;
  const sc = $('.wkl') ? $('.wkl').scrollTop : 0, sx = window.scrollY;
  S.sessions = data; drawGrid();
  try { if ($('.wkl')) $('.wkl').scrollTop = sc; window.scrollTo(0, sx); } catch (e) { }
}
function schedPollStart() {
  if (window.__schedT) return;
  window.__schedT = setInterval(() => schedPoll().catch(() => { }), 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) schedPoll().catch(() => { }); });
  window.addEventListener('focus', () => schedPoll().catch(() => { }));
}
function layoutDay(evs) {
  const items = evs.map(e => ({ e, s: mins(e.start_time), f: mins(e.start_time) + (e.duration_min || 60) })).sort((x, y) => x.s - y.s || x.f - y.f);
  const out = []; let cluster = [], end = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => { let c = cols.findIndex(x => x <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.f; it.col = c; });
    cluster.forEach(it => it.n = cols.length); out.push(...cluster); cluster = [];
  };
  items.forEach(it => { if (cluster.length && it.s >= end) { flush(); end = -1; } cluster.push(it); end = Math.max(end, it.f); });
  flush(); return out;
}
function drawGrid() {
  const grid = $('#grid'); if (!grid) return;
  const evs = S.sessions.filter(e => !S.trf || !isAdm() || e.trainer_id === S.trf);
  const sp = calSpan();
  let h0 = H0, h1 = H1;
  evs.forEach(e => { h0 = Math.min(h0, Math.floor(mins(e.start_time) / 60)); h1 = Math.max(h1, Math.ceil((mins(e.start_time) + (e.duration_min || 60)) / 60)); });
  const total = (h1 - h0) * HH;
  const shown = [...Array(sp)].map((_, i) => addDays(S.week, i));
  let lines = '', labels = '';
  for (let h = h0; h <= h1; h++) {
    lines += `<div class="hl" style="top:${(h - h0) * HH}px"></div>`;
    if (h < h1) lines += `<div class="hl half" style="top:${(h - h0) * HH + HH / 2}px"></div>`;
    labels += `<div style="top:${34 + (h - h0) * HH}px">${pad(h)}:00</div>`;
  }
  grid.className = 'week';
  grid.innerHTML = `<div class="times" style="height:${total + 34}px">${labels}</div>` + shown.map(d => {
    const ds = ymd(d);
    const items = layoutDay(evs.filter(e => e.date === ds));
    const html = items.map(({ e, s, col, n }) => {
      const act = e.bookings.filter(b => b.status !== 'cancelled' && !pausedC(b.client_id));
      const names = act.map(b => cname(b.client_id).split(' ')[0] + ' ' + (cname(b.client_id).split(' ')[1] || '')[0] + '.').join(', ');
      const full = e.kind === 'group' && e.capacity && act.length >= e.capacity;
      const top = (s - h0 * 60) / 60 * HH, hgt = Math.max(((e.duration_min || 60) / 60) * HH - 2, 18);
      const charged = !e.cancelled && act.length && new Date(`${e.date}T${hm(e.start_time)}:00`) <= new Date();
      const label = e.kind === 'solo' ? (act.length ? esc(act.map(b => cname(b.client_id)).join(', ')) : '<span class="n">свободен</span>') : `${esc(e.title || 'Групов час')}`;
      const tn0 = trName(e.trainer_id), trc = /^Петя/.test(tn0) ? 'tr-red' : /^Аксел/.test(tn0) ? 'tr-violet' : '';
      return `<div class="ev ${e.kind === 'solo' ? 'solo' : ''} ${trc} ${e.cancelled ? 'evcx' : ''} ${full ? 'full' : ''}" draggable="true" data-act="sess" data-id="${e.id}"
        style="top:${top}px;height:${hgt}px;left:calc(${col / n * 100}% + 1px);width:calc(${100 / n}% - 3px)" title="${esc(names)}">
        ${charged ? '<span class="tick" title="Проведена и таксувана">✓</span>' : ''}<b>${hm(e.start_time)}</b>${e.cancelled ? ' <span class="cx">отменен</span>' : ''} ${label}${e.kind === 'group' ? ` <span class="n">${act.length}${e.capacity ? '/' + e.capacity : ''}</span>` : ''}</div>`;
    }).join('');
    return `<div class="day"><div class="dh ${ds === today() ? 'today' : ''}">${d.toLocaleDateString('bg-BG', { weekday: 'short', day: 'numeric', month: 'numeric' })}</div>
      <div class="body" data-act="slot" data-date="${ds}" data-h0="${h0}" style="height:${total}px">${lines}${html}</div></div>`;
  }).join('');
}

async function followingSessions(s) {

}

async function loadPstat() {
  const { data, error } = await sb.from('package_status').select('*').order('end_date', { ascending: false }).range(0, 9999);
  if (error) { fail(error, 'Пакетите не се заредиха (изпълнен ли е 03_popravki.sql?)'); return []; }
  return data;
}
const CST = { active: 'Активни', wait: 'Чакащи', pause: 'Пауза', inactive: 'Неактивни' };
function cstat(c) { if (c.status === 'Paused') return 'pause'; if (c.status === 'Inactive') return 'inactive'; if (curPkg(c.id)) return 'active'; const t = today(); return (S.pstat || []).some(p => p.client_id === c.id && p.start_date > t) ? 'active' : 'wait'; }
function curPkg(cid) {
  const t = today();
  const list = (S.pstat || []).filter(p => p.client_id === cid);
  const cur = list.find(p => p.start_date <= t && p.end_date >= t);
  if (cur) return cur;
  /* като в PT Minder: последният пакет остава активен, докато има оставащи посещения, дори след крайната дата (до 60 дни след нея) */
  const last = list.filter(p => p.start_date <= t).sort((a, b) => a.start_date < b.start_date ? 1 : -1)[0];
  const lim = new Date(parse(t).getTime() - 60 * 864e5).toISOString().slice(0, 10);
  return last && last.used < last.total && last.end_date >= lim ? last : null;
}
function pkgChip(p) {
  if (!p) return '<span class="chip">без пакет</span>';
  const left = p.total - p.used, days = Math.round((parse(p.end_date) - parse(today())) / 864e5);
  const cls = left <= 0 ? 'bad' : (left <= 1 || days <= 3) ? 'warn' : 'ok';
  return `<span class="chip ${cls}">${left}/${p.total} ${p.kind === 'solo' ? 'перс.' : 'груп.'} · ${p.end_date < today() ? 'до изчерпване' : 'до ' + fmt(p.end_date)}</span>`;
}

}
function drawClients() {
  const q = S.q.toLowerCase(); S.csts = S.csts || []; if (S.cloc === undefined) S.cloc = S.loc;
  const base = S.clients.filter(c => (S.cfilter === 'mo' ? c.massage_only : !c.massage_only) && (!q || (c.name + ' ' + (c.phone || '') + ' ' + (c.email || '')).toLowerCase().includes(q)) && (S.cloc === 'all' || c.location === S.cloc));
  const cnt = k => base.filter(c => cstat(c) === k).length;
  const list = base.filter(c => {
    if (S.csts.length && !S.csts.includes(cstat(c))) return false;
    if (S.cfilter === 'exp') { const p = curPkg(c.id); if (!p) return false; const left = p.total - p.used, days = (parse(p.end_date) - parse(today())) / 864e5; return left <= 1 || days <= 3; }
    return true;
  }).sort((a, b) => ({ active: 0, wait: 1, pause: 2, inactive: 3 })[cstat(a)] - ({ active: 0, wait: 1, pause: 2, inactive: 3 })[cstat(b)] || a.name.localeCompare(b.name, 'bg'));

async function dropOnGrid(e) {

async function planFor(cid2, kind) { const { data } = await sb.from('package_status').select('id').eq('client_id', cid2).eq('kind', kind).gte('end_date', today()).limit(1); return !!(data && data.length); }
/* постоянно записване в серия: и следващите автоматично създадени часове ще са с клиента (по абонамент или еднократно) */
async function seriesJoin(seriesId, cid2, kind) { const single = (await planFor(cid2, kind)) ? null : visitPrice(kind); await sb.from('series_members').upsert({ series_id: seriesId, client_id: cid2, single_price: single }).then(() => { }, () => { }); return single; }
async function bookClient(sid, cid2, auto, seriesMode) {
  const { data: s } = await sb.from('sessions').select('*,bookings(id,status,client_id)').eq('id', sid).single();
  const ex = s.bookings.find(b => b.client_id === cid2);
  const taken = s.bookings.filter(b => b.status !== 'cancelled').length;
  if (ex && ex.status !== 'cancelled') { toast(`${cname(cid2)} вече е записан.`); return false; }
  if (s.capacity && s.kind !== 'solo' && taken >= s.capacity) { if (auto) { toast('Часът е пълен.'); return false; } if (!confirm(`Часът е пълен (${taken}/${s.capacity}). Да се добави ли все пак?`)) return false; }
  const { data: ps } = await sb.from('package_status').select('*').eq('client_id', cid2).eq('kind', s.kind).lte('start_date', s.date).gte('end_date', s.date);
  const valid = (ps || []).find(p => p.used < p.total);
  // Записване напред: клиент с активен абонамент от този вид се записва винаги по абонамента (изчерпан/изтичащ пакет не пречи; подновява се автоматично)
  const { data: anyPk } = await sb.from('package_status').select('id').eq('client_id', cid2).eq('kind', s.kind).gte('end_date', today()).limit(1);
  const hasPlan = !!valid || !!(anyPk && anyPk.length);
  let use_plan = true, price = null;
  if (!hasPlan) {
    if (!auto && !seriesMode) {
      const why = (ps || []).length ? 'пакетът му е изчерпан' : 'няма ' + (s.kind === 'solo' ? 'пакет с персонални тренировки' : 'пакет с групови класове') + ' за тази дата';
      if (!confirm(`${cname(cid2)}: ${why}.\n\nOK = добави като еднократно посещение (${money(visitPrice(s.kind))}).\nОтказ = не добавяй.`)) return false;
    }
    use_plan = false; price = visitPrice(s.kind);
  }
  let bid;
  if (ex) { const r = await sb.from('bookings').update({ status: 'booked', late: false, use_plan, price }).eq('id', ex.id).select('id').single(); if (r.error) { fail(r.error, 'Не се добави'); return false; } bid = r.data.id; }
  else { const r = await sb.from('bookings').insert({ session_id: sid, client_id: cid2, use_plan, price }).select('id').single(); if (r.error) { fail(r.error, 'Не се добави'); return false; } bid = r.data.id; }
  /* еднократното посещение се таксува автоматично след края на часа */
  logEvent('new', `Записан: ${bkLabel(cid2, s.date, s.start_time)}${s.title ? ' · ' + s.title : ''}${use_plan ? ' (абонамент)' : ' (еднократно)'}`, s.location);
  return true;
}

const calStamp = (date, time, addMin = 0) => { const [y, m, d] = date.split('-').map(Number), t = mins(time) + addMin; const x = new Date(y, m - 1, d + Math.floor(t / 1440)); return `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(Math.floor((t % 1440) / 60))}${pad(t % 60)}00`; };

function icsFor(list) {

  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//NLT//BG\r\nCALSCALE:GREGORIAN\r\n${ev}\r\nEND:VCALENDAR\r\n`;
}

const WC = { ex: null, cfg: null, res: null, cid: null, loading: false, err: null, sres: null, sloc: null };
const WC_DAYS = ['', 'Понеделник', 'Вторник', 'Сряда', 'Четвъртък', 'Петък'];
const wcSec = s => { s = String(s || '').trim().replace(',', '.'); if (!s) return null; if (s.includes(':') || s.includes('.')) { const [a, b] = s.split(/[:.]/); const m = +a, x = +(b || 0); if (isNaN(m) || isNaN(x) || x >= 60) return null; return m * 60 + x; } const n = +s; return isNaN(n) ? null : n * 60; };

  const v = Array.isArray(e.variants) ? e.variants : [];
  const mult = v.filter(x => +x.m !== 1).map(x => `${x.k.toLowerCase()} ×${x.m}`).join(', ');
  return `${+e.per === 1 ? '1 т. за всяко повторение' : '1 т. за всеки ' + (+e.per) + ' ' + e.unit}${mult ? ' · ' + mult : ''}`;

/* ── графики ── */
function pgChart(series, o = {}) {
  const W = 320, H = o.h || 170, L = 34, R = 10, T = 10, B = 22;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return '<div class="pg-empty">Още няма данни за графика.</div>';
  const xs = all.map(p => parse(p.d).getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  const ys = all.map(p => p.v); if (o.goal != null) ys.push(o.goal);
  let y0 = o.ymin ?? Math.min(...ys), y1 = o.ymax ?? Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * .1; if (o.ymin == null) y0 -= pad; if (o.ymax == null) y1 += pad;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const dec = (y1 - y0) < 6 ? 1 : 0;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="pg-gl"/><text x="${L - 4}" y="${y + 3}" text-anchor="end" class="pg-tx">${pgF(v, dec)}</text>`; }
  g += `<text x="${L}" y="${H - 6}" class="pg-tx">${pgDm(ymd(new Date(x0)))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" class="pg-tx">${pgDm(ymd(new Date(x1)))}</text>`;
  if (o.goal != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" class="pg-goal"/><text x="${W - R}" y="${Y(o.goal) - 4}" text-anchor="end" class="pg-tx pg-gt">цел ${pgF(o.goal)}</text>`;
  series.forEach((s, i) => {
    const c = s.color || PG_COL[i % 4], pts = s.pts.slice().sort((a, b) => a.d.localeCompare(b.d));
    if (pts.length > 1 && !s.dotsOnly) g += `<polyline fill="none" stroke="${c}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p => X(parse(p.d).getTime()).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/>`;
    if (s.dots !== false) pts.forEach(p => g += `<circle cx="${X(parse(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${s.r || 3}" fill="${c}" class="pg-dot"><title>${esc(s.name || '')} ${fmt(p.d)}: ${pgF(p.v, 1)}</title></circle>`);
  });
  const leg = series.length > 1 || series[0]?.name ? `<div class="pg-leg">${series.filter(s => s.name).map((s, i) => `<span><i style="background:${s.color || PG_COL[i % 4]}"></i>${esc(s.name)}</span>`).join('')}${o.goal != null ? '<span><i class="gd"></i>цел</span>' : ''}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="pg-svg" role="img" aria-label="${esc(o.label || 'графика')}">${g}</svg>${leg}`;
}
function pgBars(tests) {
  const st = PG.st, W = 320, H = 170, L = 8, B = 36, T = 8, gw = (W - L - 8) / st.secs.length;
  const sub = tests.filter(t => t.status === 'submitted'); if (!sub.length) return '';
  const bw = Math.min(16, (gw - 10) / sub.length);
  let g = '';
  [0, .5, 1].forEach(f => { const y = T + (1 - f) * (H - T - B); g += `<line x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}" class="pg-gl"/><text x="${W - 6}" y="${y - 2}" text-anchor="end" class="pg-tx">${f * 100}%</text>`; });
  st.secs.forEach((s, i) => {
    const x = L + i * gw + (gw - bw * sub.length) / 2;
    sub.forEach((t, j) => { const p = (t.scores || {})[s.key] ?? 0, h = Math.max(1, p / s.max_points * (H - T - B)); g += `<rect x="${(x + j * bw).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${bw - 2}" height="${h.toFixed(1)}" rx="2" fill="${PG_COL[t.test_no - 1]}"><title>Тест ${t.test_no} · ${esc(s.title)}: ${p} т. (${Math.round(p / s.max_points * 100)}%)</title></rect>`; });
    const lab = s.title.split(' ')[0]; g += `<text x="${L + i * gw + gw / 2}" y="${H - 20}" text-anchor="middle" class="pg-tx">${esc(lab.length > 9 ? lab.slice(0, 8) + '.' : lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="pg-svg" role="img" aria-label="Точки по раздели в % от максимума">${g}</svg><div class="pg-leg">${sub.map(t => `<span><i style="background:${PG_COL[t.test_no - 1]}"></i>Тест ${t.test_no}</span>`).join('')}<span>% от максимума</span></div>`;

function pgWeightStats() {
  const w = PG.D.weights, p = PG.D.profile || {}, t = today();
  if (!w.length) return { n: 0 };
  const from = ymd(addDays(parse(t), -6)), recent = w.filter(x => x.day >= from);
  const now = recent.length ? pgAvg(recent.map(x => Number(x.weight_kg))) : Number(w[w.length - 1].weight_kg);
  const first = w.filter(x => x.day < ymd(addDays(parse(w[0].day), 7)));
  const start = p.start_weight != null ? Number(p.start_weight) : pgAvg(first.map(x => Number(x.weight_kg)));
  const wk = {}; w.forEach(x => (wk[pgMon(x.day)] ||= []).push(Number(x.weight_kg)));
  const wl = Object.keys(wk).sort().map(k => ({ k, v: pgAvg(wk[k]) }));
  let pct = null; if (wl.length >= 2) pct = (wl[wl.length - 1].v - wl[wl.length - 2].v) / wl[wl.length - 2].v;
  const goal = p.goal, tgt = p.target_weight != null ? Number(p.target_weight) : null;
  let pace = null;
  if (pct != null && goal) {
    if (goal === 'Отслабване') pace = pct < -0.01 ? ['Твърде бързо', 'bad'] : pct <= -0.005 ? ['Оптимално', 'ok'] : pct < 0 ? ['Бавно', 'warn'] : ['Без спад', 'warn'];
    else if (goal.startsWith('Покачване')) pace = pct > 0.005 ? ['Твърде бързо', 'bad'] : pct >= 0.0025 ? ['Оптимално', 'ok'] : pct > 0 ? ['Бавно', 'warn'] : ['Без покачване', 'warn'];
    else pace = Math.abs(pct) <= 0.005 ? ['Стабилно', 'ok'] : ['Отклонение', 'warn'];
  }
  const hint = !goal ? '' : goal === 'Отслабване' ? 'Препоръчително темпо: −0,5% до −1,0% от теглото на седмица' + (start ? ` (≈ ${pgF(start * .005)}–${pgF(start * .01)} кг)` : '') : goal.startsWith('Покачване') ? 'Препоръчително темпо: +0,25% до +0,5% от теглото на седмица' + (start ? ` (≈ ${pgF(start * .0025, 2)}–${pgF(start * .005, 2)} кг)` : '') : 'Поддържане/рекомпозиция: теглото остава в ±0,5% седмично — следете обиколките, снимките и силата в залата.';
  const ma = w.map(x => { const lo = ymd(addDays(parse(x.day), -6)); return { d: x.day, v: pgAvg(w.filter(y => y.day >= lo && y.day <= x.day).map(y => Number(y.weight_kg))) }; });
  return { n: w.length, now, start, change: start != null ? now - start : null, left: tgt != null ? Math.abs(now - tgt) : null, tgt, pct, pace, hint, ma };
}

function pgQuizTab() {

    ${nextN ? `<div class="pg-next">Следващ: <b>${names[nextN - 1]}</b> — до ${fmt(dates[nextN - 1])}</div>` : '<div class="pg-next">Всички тестове са попълнени.</div>'}
    <div class="pg-qlist">${cards}</div></section>${subs.length ? pgCompare(subs) : ''}`;

function pgCompare(subs) {
  const st = PG.st, tn = [1, 2, 3].filter(n => subs.some(t => t.test_no === n)), by = n => subs.find(t => t.test_no === n);
  const cell = (t, key, max, low, high) => { if (!t) return '<td>—</td>'; const p = (t.scores || {})[key] ?? 0; return `<td><b>${p}</b> <small>${Math.round(p / max * 100)}%</small><br>${pgChip(pgPrio(p, low, high), PG_PR[pgPrio(p, low, high)])}</td>`; };
  const first = by(tn[0]), lastT = by(tn[tn.length - 1]);
  const rows = st.secs.map(s => `<tr><th>${esc(s.title)}</th>${tn.map(n => cell(by(n), s.key, s.max_points, s.low, s.high)).join('')}<td>${tn.length > 1 ? pgDelta((lastT.scores || {})[s.key] - (first.scores || {})[s.key]) : '—'}</td></tr>`).join('')
    + `<tr class="tot"><th>Общо</th>${tn.map(n => cell(by(n), 'total', st.max, st.low, st.high)).join('')}<td>${tn.length > 1 ? pgDelta((lastT.scores || {}).total - (first.scores || {}).total) : '—'}</td></tr>`;
  return `<section class="pg-card"><h3 class="pg-h">Сравнение на тестовете</h3><div class="pg-scroll"><table class="pg-t"><tr><th></th>${tn.map(n => `<th>Тест ${n}</th>`).join('')}<th>Промяна</th></tr>${rows}</table></div>
    <div class="pg-mute pg-sm">Промяната е спрямо първия тест: отрицателно число (зелено) = подобрение.</div>${pgBars(subs)}</section>`;
}
const pgDelta = d => d == null || isNaN(d) ? '—' : `<b class="${d < 0 ? 'pg-good' : d > 0 ? 'pg-badt' : ''}">${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d)}</b>`;
function pgResult(n) {

      <div class="pg-mute pg-sm">${p} от ${s.max_points} т. (${Math.round(p / s.max_points * 100)}%)</div><p class="pg-rec">${esc(s.recs[pr] || '')}</p>${det}</div>`;
  }).join('');

  return `<section class="pg-card"><div class="pg-row"><button class="pg-ico" data-act="pgqback" aria-label="Назад">←</button><h3 class="pg-h" style="margin:0">Тест ${n} · резултат</h3></div>
    <div class="pg-tot">Общо <b>${tot}</b> от ${st.max} т. ${pgChip(tp, PG_PR[tp])}</div>${secs}${note}</section>`;
}

async function pgLoadPhotos() {
  const els = [...document.querySelectorAll(`#${PG.elId} [data-ph]`)].filter(e => e.dataset.ph); if (!els.length) return;
  const paths = [...new Set(els.map(e => e.dataset.ph))], need = paths.filter(p => !PG.urls[p] || PG.urls[p].exp < Date.now());
  if (need.length) {
    const { data, error } = await sb.storage.from('progress-photos').createSignedUrls(need, 3600);
    if (error) { els.forEach(e => e.innerHTML = '<span class="pg-mute pg-sm">няма достъп</span>'); return; }
    (data || []).forEach(r => { if (r.signedUrl) PG.urls[r.path] = { u: r.signedUrl, exp: Date.now() + 3000e3 }; });
  }
  els.forEach(e => { const u = PG.urls[e.dataset.ph]; e.innerHTML = u ? `<img src="${esc(u.u)}" alt="Снимка на прогреса" loading="lazy">` : '<span class="pg-mute pg-sm">—</span>'; });
}
function pgResize(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('Снимката не се обработи')), 'image/jpeg', .85); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Файлът не е изображение')); };
    img.src = url;
  });
}

async function pgQSave(status, quiet) {
  const q = PG.q, c = PG.cid;
  const row = { client_id: c, test_no: q.n, answers: q.ans, status };
  if (PG.staff && status === 'draft' && PG.D.tests.find(t => t.test_no === q.n)?.status === 'submitted') row.status = 'submitted';
  const { error } = await sb.from('questionnaire_tests').upsert(row, { onConflict: 'client_id,test_no' });
  if (error) throw error;
  if (!quiet) return;
  const t = PG.D.tests.find(x => x.test_no === q.n); if (t) { t.answers = { ...q.ans }; } else PG.D.tests.push({ test_no: q.n, answers: { ...q.ans }, status: 'draft' });
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'ov') { if (e.target === el) modal.close(); return; }
  if (act === 'slot') {
    if (e.target.closest('.ev')) return;
    const r = el.getBoundingClientRect(); const y = e.clientY - r.top;
    const tt = fromMins(Math.floor((y / HH * 60) / 30) * 30 + (+el.dataset.h0) * 60);
    if (S.waitPick) return quickBook(S.waitPick, el.dataset.date, tt);
    return newSessionDialog(el.dataset.date, tt);
  }
  e.preventDefault();
  try {
    if (act.startsWith('pg') && (await pgAct(act, el)) !== 'nohandle') return;
    if (act.startsWith('fin')) { await finAct(act, el); return; }
    switch (act) {
      case 'close': modal.close(); break;
      case 'login': await doLogin(); break;
      case 'sendcode': await doSendCode(); break;
      case 'verifycode': await doVerifyCode(); break;
      case 'pwmode': S.otpEmail = ($('#em')?.value || '').trim(); loginView('', 'pw'); break;
      case 'codemode': S.otpEmail = ($('#em')?.value || '').trim(); loginView('', 'code'); break;
      case 'skippw': boot(); break;
      case 'othermail': S.otpEmail = ''; loginView('', 'code'); break;
      case 'cnav': C.tab = el.dataset.t; renderClient(); window.scrollTo(0, 0); break;
      case 'weighgo': C.tab = 'prog'; PG.tab = 'weight'; renderClient(); window.scrollTo(0, 0); break;
      case 'csvc': C.svcMode = el.dataset.m; renderClient(); break;
      case 'cday': C.day = el.dataset.d; renderClient(); break;
      case 'cbmode': C.bmode = el.dataset.m; renderClient(); break;
      case 'cwk': C.wkOff = Math.max(0, Math.min(3, (C.wkOff || 0) + +el.dataset.d)); renderClient(); break;
      case 'cwkloc': C.wkLoc = el.dataset.l; renderClient(); break;
      case 'cask': clientAsk(el.dataset.id); break;
      case 'csheetx': closeSheet(); break;
      case 'cprofile': clientProfile(); break;
      case 'forgot': await doForgot(); break;
      case 'setpw': await doSetPw(); break;
      case 'cpreview': { const c = S.clients.find(x => x.id === el.dataset.id); modal.close(); S.previewClient = c; S.me = { role: 'client', row: c }; C.tab = 'home'; await clientApp(); break; }
      case 'exitpreview': exitPreview(); break;
      case 'logout': if (S.previewClient) { closeSheet(); exitPreview(); break; } closeSheet(); await sb.auth.signOut(); S.me = null; S.view = null; loginView(); break;
      case 'tab': S.tab = el.dataset.t; renderStaff(); break;
      case 'hloc': { S.loc = el.dataset.l; S.cloc = S.loc; store.set('nlt-loc', S.loc); D.ploc = null; document.querySelectorAll('#loc button').forEach(b => b.classList.toggle('on', b.dataset.l === S.loc)); renderTab(); break; }

      case 'wcno': await wcSetStatus(el.dataset.id, 'rejected'); break;
      case 'wcadd': await wcStaffAdd(); break;
      case 'wcrm': { if (!confirm('Да се изтрие ли резултатът?')) break; const { error } = await sb.from('challenge_results').delete().eq('id', el.dataset.id); if (error) fail(error, 'Не се изтри'); else wcStaff(); break; }
      case 'cphone': await phoneSave(); break;
      case 'cdo': await clientCancel(el.dataset.bid); break;
      case 'blate': break;
    }
  } catch (err) { fail(err, 'Грешка'); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset && e.target.dataset.pspk) { const f = e.target.dataset.pspk, p = (D.psub || []).find(x => x.id === e.target.value), sd = $('#' + f + '-sd'), w = $('#' + f + '-sdw'); if (w) w.style.display = p ? '' : 'none'; if (p && sd) sd.value = p.start_date; return; }
  if (e.target.id === 'trsel') { S.trf = e.target.value || null; drawGrid(); return; }
  if (e.target.id === 'phm') { D.phm = e.target.value; D.phist = null; redrawPay(); loadPayHist(); return; }
  if (e.target.dataset && e.target.dataset.act === 'wall') { S.wall = e.target.checked; $('#wbtn').innerHTML = waitHtml(); return; }
  if (e.target.id === 'klist-sel') { D.klist = e.target.value; return kpiView(); }
  const el = e.target.closest('[data-act=blate]');
  if (el) { const bid = el.closest('.bk').dataset.bid; await sb.from('bookings').update({ late: el.checked }).eq('id', bid); await refreshAfter(sessId()); }
});
/* Търсене на клиент за записване: без неактивни; само от текущия обект (другите — само ако тук няма съвпадение) */
function pickClients(q, loc0) {
  const L = (S.clients || []).filter(c => c.status !== 'Inactive' && String(c.name || '').toLowerCase().includes(q));
  const loc = loc0 || S.loc, here = L.filter(c => !LOCS.includes(loc) || !c.location || c.location === loc);
  return (here.length ? here : L.map(c => ({ ...c, _other: true }))).sort((a, b) => a.name.localeCompare(b.name, 'bg')).slice(0, 8);
}
function nChips() { const b = $('#n-chips'); if (!b) return; const ids = ($('#n-cid').value || '').split(',').filter(Boolean); b.innerHTML = ids.map(id => `<span class="chip">${esc(cname(id))} <a href="#" data-act="nunpick" data-id="${id}" title="Махни">✕</a></span>`).join(''); }
document.addEventListener('input', e => {
  if (e.target.id !== 'n-cq') return;
  const q = e.target.value.trim().toLowerCase(), box = $('#n-res');
  if (q.length < 2) { box.classList.add('hide'); return; }
  const m = pickClients(q);
  box.innerHTML = m.map(c => `<div data-npick="${c.id}">${esc(c.name)} <span class="mute">${esc(c.phone || '')}${c._other ? ' · ' + esc(c.location) : ''}</span></div>`).join('') || '<div class="mute">Няма активен клиент с това име</div>';
  box.classList.remove('hide');
});
document.addEventListener('click', e => {
  const p = e.target.closest('[data-npick]'); if (!p) return;
  const ids = ($('#n-cid').value || '').split(',').filter(Boolean); if (!ids.includes(p.dataset.npick)) ids.push(p.dataset.npick);
  $('#n-cid').value = ids.join(','); $('#n-cq').value = ''; $('#n-res').classList.add('hide'); nChips();
  if ($('#n-kind').value === 'solo' && !$('#n-title').value.trim()) $('#n-title').placeholder = cname(p.dataset.npick);
});
document.addEventListener('change', e => { if (e.target.id === 'n-kind') { const w = $('#n-capw'); if (w) w.style.display = e.target.value === 'solo' ? 'none' : ''; } });
document.addEventListener('input', e => {
  if (e.target.id !== 'add-q') return;
  const q = e.target.value.trim().toLowerCase(), box = $('#add-res');
  if (q.length < 2) { box.classList.add('hide'); return; }
  const m = pickClients(q, D.sessLoc);
  box.innerHTML = m.map(c => `<div data-pick="${c.id}">${esc(c.name)} <span class="mute">${esc(c.phone || '')}${c._other ? ' · ' + esc(c.location) : ''}</span></div>`).join('') || '<div class="mute">Няма активен клиент с това име</div>';
  box.classList.remove('hide');
});
document.addEventListener('click', async e => {
  const p = e.target.closest('[data-pick]'); if (!p) return;
  $('#add-res').classList.add('hide'); $('#add-q').value = '';
  await addClientToSession(p.dataset.pick);
});
document.addEventListener('dragstart', e => {
  const ev = e.target.closest?.('.ev'), w = e.target.closest?.('.wi');
  if (ev) { S.dragOff = e.clientY - ev.getBoundingClientRect().top; e.dataTransfer.setData('text/plain', 'ev:' + ev.dataset.id); e.dataTransfer.effectAllowed = 'move'; }
  else if (w) e.dataTransfer.setData('text/plain', 'wait:' + w.dataset.id);
});
document.addEventListener('dragover', e => { if (e.target.closest?.('.body')) e.preventDefault(); });
document.addEventListener('drop', e => { dropOnGrid(e); });
document.addEventListener('input', e => { if (e.target.id !== 'wadd') return; const q = e.target.value.trim().toLowerCase(), box = $('#wadd-res'); if (q.length < 2) { box.classList.add('hide'); return; }
  const m = pickClients(q); box.innerHTML = m.map(c => `<div data-act="wput" data-id="${c.id}">${esc(c.name)} <span class="mute">${esc(c.phone || '')}${c._other ? ' · ' + esc(c.location) : ''}</span></div>`).join('') || '<div class="mute">Няма резултат</div>'; box.classList.remove('hide'); });
document.addEventListener('input', e => { if (e.target.id === 'wq') { S.wq = e.target.value; const pos = e.target.selectionStart; $('#wbtn').innerHTML = waitHtml(); const n = $('#wq'); n.focus(); n.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.open()) modal.close(); });

if (location.hash.includes('type=recovery')) loginView('', 'recovery'); else boot();

// ДД/ММ/ГГГГ за всички полета за дата (стойността остава ГГГГ-ММ-ДД)
(function () {
  const txt = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
  const upd = i => { const t = i.parentNode && i.parentNode.querySelector(':scope>.dtxt'); if (!t) return; const s = txt(i.value); if (t.textContent !== (s || 'дд/мм/гггг')) t.textContent = s || 'дд/мм/гггг'; t.classList.toggle('ph', !s); };
  const wrap = i => {
    if (i.dataset.dw) return; i.dataset.dw = 1;
    const cs = getComputedStyle(i), col = cs.color, w = document.createElement('span'); w.className = 'dwrap';
    if (cs.display === 'block' || cs.width === (i.parentNode && getComputedStyle(i.parentNode).width)) w.style.display = 'block';
    if (cs.flexGrow && cs.flexGrow !== '0') w.style.flex = cs.flex;
    if (i.style.width) { w.style.width = i.style.width; }
    w.style.margin = cs.margin; i.style.margin = '0';
    i.parentNode.insertBefore(w, i); w.appendChild(i);
    const t = document.createElement('span'); t.className = 'dtxt'; t.style.color = col; w.appendChild(t);
    ['input', 'change', 'blur'].forEach(e => i.addEventListener(e, () => upd(i)));
    i.addEventListener('click', () => { try { i.showPicker && i.showPicker(); } catch (e) { } });
    upd(i);
  };
  const scan = () => document.querySelectorAll('input[type=date]').forEach(i => { if (!i.dataset.dw) wrap(i); else upd(i); });
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  setInterval(() => document.querySelectorAll('input[type=date][data-dw]').forEach(upd), 400);
  document.addEventListener('DOMContentLoaded', scan); scan();
})();
</script>
